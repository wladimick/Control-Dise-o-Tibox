name: Apply modal feature

on:
  push:
    branches:
      - feat/modal-edicion-importacion
    paths:
      - feature-payload.tgz.b64
      - .github/workflows/apply-modal-feature.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/modal-edicion-importacion
          fetch-depth: 0
      - name: Apply feature payload
        shell: bash
        run: |
          test -f feature-payload.tgz.b64 || exit 0
          base64 --decode feature-payload.tgz.b64 > /tmp/feature-payload.tgz
          echo "3d20a8a13147fb09e1544f51d0de381f3375a907322a1b8f1855095232d7982d  /tmp/feature-payload.tgz" | sha256sum --check -
          tar -xzf /tmp/feature-payload.tgz -C .
          rm -f feature-payload.tgz.b64 .github/workflows/apply-modal-feature.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: agregar edición rápida modal e importación"
          git push origin HEAD:feat/modal-edicion-importacion
