name: Apply modal feature

on:
  push:
    branches:
      - feat/modal-edicion-importacion
    paths:
      - modal-feature.patch.part.*
      - .github/workflows/apply-modal-feature.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/modal-edicion-importacion
          fetch-depth: 0
      - name: Apply feature patch
        shell: bash
        run: |
          test -f modal-feature.patch.part.03 || exit 0
          cat modal-feature.patch.part.* > /tmp/modal-feature.patch
          patch -p2 < /tmp/modal-feature.patch
          rm -f modal-feature.patch.part.* .github/workflows/apply-modal-feature.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: agregar edición rápida modal e importación"
          git push origin HEAD:feat/modal-edicion-importacion
